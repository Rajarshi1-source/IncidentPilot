# No `version:` key -- obsolete in Compose v2, which warns on it (B-14).
#
# The defining property of this file: `docker compose up` works on a clean clone
# with NO .env file and NO credentials. Every secret below defaults with `:-`,
# never `:?` (conflict C-02), and the chat and LLM providers default to `fake`.
# An interviewer can clone this repository and run the full demo -- storm
# compression, war room, PIR -- without an API key. Very few portfolio projects
# actually run for a stranger; be one of them.
name: incidentpilot

# --- host port block -----------------------------------------------------------
# Published ports are remapped out of the default range and overridable, because
# this machine runs several capstone projects side by side and two of the
# defaults were already taken: 5432 by a local PostgreSQL install, and 8000 by a
# running TraceMap container. 3000 (the week-8 dashboard) and 3001 are taken too.
#
# Only the HOST side moves. Inside the compose network the services still talk
# to postgres:5432 and valkey:6379 -- container-to-container addressing is
# unaffected, which is why IP_DATABASE_URL below is unchanged.
#
# Override any of them without editing this file:
#   IP_PORT_API=9000 docker compose up
#
# 3000 is taken by another capstone, so the dashboard publishes on 13000.

x-bot-env: &bot-env
  IP_ENVIRONMENT: local
  IP_DATABASE_URL: postgresql+psycopg://ip:ip@postgres:5432/incidentpilot
  IP_VALKEY_URL: redis://valkey:6379/0

  # Fake by default. A fake LLM provider alone is not enough -- channel creation
  # would still call a Slack API that rejects a placeholder token (C-02).
  IP_CHAT_PROVIDER: ${CHAT_PROVIDER:-fake}
  IP_METRICS_PROVIDER: ${METRICS_PROVIDER:-fake}
  IP_PAGING_PROVIDER: ${PAGING_PROVIDER:-static}

  IP_SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-dev-not-a-real-secret}
  IP_SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-fake-for-demo}
  IP_ALERTMANAGER_BEARER: ${ALERTMANAGER_BEARER:-local-dev-token}
  IP_PAGING_WEBHOOK_SECRET: ${PAGING_WEBHOOK_SECRET:-local-dev-paging-secret}

  IP_REDACT_PII: "true"
  IP_LOG_JSON: "true"

services:
  # Migrations as their own one-shot service, not as an API entrypoint step
  # (W8-11). Three reasons, and the third is the one that matters:
  #
  #  - the API runs two uvicorn workers, so an entrypoint migration races
  #    itself on every start;
  #  - a migration failure should stop the stack, not restart-loop a container
  #    that reports unhealthy for an unrelated-looking reason;
  #  - `service_completed_successfully` below makes "the schema is ready" an
  #    explicit edge in the dependency graph rather than a timing assumption.
  #
  # This is the same defect the integration suite had in week 7 -- a schema that
  # existed as a side effect of something else having run first.
  migrate:
    build:
      context: ./bot
      target: runtime
    environment: *bot-env
    # Schema THEN reference data, in that order, in one place. `services` must
    # be populated before anything ingests: correlation's topology signal reads
    # `services.graph_depth`, and on a clean clone an empty table turns a
    # 40-alert cascade into 36 incidents -- D3 silently absent on exactly the
    # scenario G8 tests. The reference tables come first for the same reason
    # migration 0001 creates them first (C-09).
    entrypoint:
      - sh
      - -c
      - alembic upgrade head && python -m incidentpilot.config.sync_reference
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: ./bot
      target: runtime
    environment: *bot-env
    ports: ["${IP_PORT_API:-18000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # The orchestration half. A separate process from the API because the two are
  # bound by different things: ingest is latency-bound with a 250 ms p99 to
  # hold, orchestration is CPU-bound on correlation and intent classification.
  # Sharing a process means a forty-alert storm competes with the webhook still
  # trying to return 202 -- the bulkhead, at the process level.
  worker:
    build:
      context: ./bot
      target: runtime
    environment:
      <<: *bot-env
      IP_CONSUMER_NAME: worker-1
    entrypoint: ["python", "-m", "incidentpilot.orchestration.consumer"]
    # The image's HEALTHCHECK curls :8000/healthz, which only the API serves.
    # Inherited unchanged, these background processes report `unhealthy`
    # forever: `docker compose ps` lies, and a Kubernetes liveness probe built
    # the same way would restart-loop a perfectly healthy worker. A process with
    # no HTTP surface is supervised by whether it is running.
    healthcheck: {disable: true}
    depends_on:
      valkey: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # The ONLY process permitted to perform an external write (INV-03). One
  # replica, deliberately: the outbox's idempotency keys make a second one safe,
  # but "safe" and "necessary" are different, and a single writer is the
  # simplest thing that satisfies the invariant.
  relay:
    build:
      context: ./bot
      target: runtime
    environment: *bot-env
    entrypoint: ["python", "-m", "incidentpilot.orchestration.relay"]
    # The image's HEALTHCHECK curls :8000/healthz, which only the API serves.
    # Inherited unchanged, these background processes report `unhealthy`
    # forever: `docker compose ps` lies, and a Kubernetes liveness probe built
    # the same way would restart-loop a perfectly healthy worker. A process with
    # no HTTP surface is supervised by whether it is running.
    healthcheck: {disable: true}
    depends_on:
      valkey: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # The periodic sweeps: SLA nudges, abandonment, reconciliation, and the PIR.
  #
  # PIR generation lives here rather than in the worker because it is the one
  # job that can take sixty seconds and spend money -- putting it on the ingest
  # consumer would let a slow model call block a storm. The state machine makes
  # the polling safe: `resolved -> pir_drafting` is guarded by
  # UNIQUE (incident_id, seq), so two schedulers cannot both claim an incident.
  scheduler:
    build:
      context: ./bot
      target: runtime
    environment: *bot-env
    entrypoint: ["python", "-m", "incidentpilot.orchestration.scheduler"]
    # The image's HEALTHCHECK curls :8000/healthz, which only the API serves.
    # Inherited unchanged, these background processes report `unhealthy`
    # forever: `docker compose ps` lies, and a Kubernetes liveness probe built
    # the same way would restart-loop a perfectly healthy worker. A process with
    # no HTTP surface is supervised by whether it is running.
    healthcheck: {disable: true}
    depends_on:
      valkey: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # The dashboard (W8-03). DEMO_MODE on by default in compose: this is the
  # thing a stranger opens after `docker compose up`, and the one setting they
  # must not be able to get wrong is the one that could reach a real workspace.
  dashboard:
    build:
      context: ./dashboard
      target: runtime
    environment:
      # Server-side only. The dashboard's Server Components call the API from
      # inside the compose network; nothing here is exposed to the browser,
      # which is why the API URL is a container address rather than a published
      # port.
      IP_API_URL: http://api:8000
      IP_DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["${IP_PORT_DASHBOARD:-13000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.2
    environment:
      POSTGRES_DB: incidentpilot
      POSTGRES_USER: ip
      POSTGRES_PASSWORD: ip
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./deploy/compose/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ip -d incidentpilot"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["${IP_PORT_POSTGRES:-55432}:5432"]

  valkey:
    image: valkey/valkey:9.1.2-alpine
    # AOF everysec: a hard crash loses at most one second of stream entries, and
    # Alertmanager re-sends on its repeat_interval anyway. That bounded, already
    # recoverable loss is why this is a single instance and not a Sentinel set.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["${IP_PORT_VALKEY:-56379}:6379"]

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes: ["./monitoring/prometheus:/etc/prometheus:ro"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports: ["${IP_PORT_PROMETHEUS:-19090}:9090"]
    depends_on: [api]

  alertmanager:
    image: prom/alertmanager:v0.34.0
    volumes: ["./monitoring/alertmanager:/etc/alertmanager:ro"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports: ["${IP_PORT_ALERTMANAGER:-19093}:9093"]

volumes:
  pgdata: {}
  valkeydata: {}
