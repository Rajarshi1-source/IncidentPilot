# The prompt registry (W6-15).
#
# Every pir_documents row records prompt_version AND prompt_sha256, so any PIR
# in the database can be regenerated byte-identically. A version string can lie;
# a content hash cannot.
#
# Editing a prompt file without updating this entry raises PromptIntegrityError
# at load time. That is deliberate and it is what week 7's CI gate (B-11) turns
# red on: two different prompts under one version make an eval corpus
# meaningless, and the corpus is the only evidence that a prompt change helped.

prompts:
  synthesize:
    file: pir_v2_1_0.md
    version: "2.1.0"
    sha256: "8646196fbe3778c23afb0f15194744b76810d221f9a85159deb1feb8ab4c5d3a"
