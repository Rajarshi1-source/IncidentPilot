name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"
  PYTHON_VERSION: "3.14.7"

jobs:
  # Path filtering done properly. Rev 1 gated on
  # `github.event.head_commit.modified`, which is only populated on push events,
  # is absent on pull requests, and is a list -- so `contains()` tests exact
  # element equality and is false essentially always. That job never ran once.
  # A quality gate that never runs is worse than no gate, because you believe
  # you have one. (B-11)
  changes:
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      prompts: ${{ steps.filter.outputs.prompts }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bot:
              - 'bot/**'
              # Runbooks are markdown, but they are parsed, matched and pinned
              # by code -- an edit that breaks a step marker breaks D4's
              # efficacy numbers, so it belongs in the bot's test run.
              - 'runbooks/**'
            # B-11: this filter drives week 7's eval gate, and both paths now
            # exist -- the prompt registry and models.yaml landed in week 6. A
            # path filter pointing at nothing is the same defect as the
            # `head_commit.modified` check it replaced.
            prompts:
              - 'bot/src/incidentpilot/pir/prompts/**'
              - 'bot/src/incidentpilot/config/models.yaml'
              - 'bot/eval/**'
              # Wider than the reference's three paths, deliberately. These are
              # the modules whose behaviour the eval metrics actually measure:
              # the validator decides citation_precision, the context builds the
              # set that decides fabricated_citations, and impact decides which
              # numbers a claim may contain. A change to any of them moves the
              # gate's numbers, so a filter that excluded them would let the
              # most consequential edits past the one check that would notice.
              - 'bot/src/incidentpilot/pir/validator.py'
              - 'bot/src/incidentpilot/pir/context.py'
              - 'bot/src/incidentpilot/pir/schema.py'
              - 'bot/src/incidentpilot/impact/**'
              - 'bot/src/incidentpilot/domain/evidence.py'
            dashboard:
              - 'dashboard/**'
            config:
              - 'monitoring/**'
              - 'docker-compose.yml'
              - 'charts/**'

  lint-and-type:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
        working-directory: bot

      - name: ruff check
        run: uv run ruff check src tests
        working-directory: bot

      - name: ruff format
        run: uv run ruff format --check src tests
        working-directory: bot

      - name: mypy --strict
        run: uv run mypy
        working-directory: bot

      # INV-07. The system defines three roles -- extract, synthesize, judge --
      # and each resolves through an adapter from config. A model name in code
      # means a price change becomes a code change.
      - name: No hardcoded model or vendor names
        run: |
          if grep -rEn "gpt-[0-9]|claude-|gemini-|llama-" bot/src --include="*.py" \
             | grep -v "src/incidentpilot/config/"; then
            echo "::error::hardcoded model name - resolve through LLMRouter roles"
            exit 1
          fi
          echo "no hardcoded model names"

      # INV-05 cannot be switched off in a production config.
      - name: Configuration invariants hold for production
        run: uv run python -m incidentpilot.config.assert_invariants --environment prod
        working-directory: bot
        env:
          IP_ALERTMANAGER_BEARER: ci-placeholder
          IP_SLACK_SIGNING_SECRET: ci-placeholder
          IP_PAGING_WEBHOOK_SECRET: ci-placeholder
          IP_CHAT_PROVIDER: slack
          IP_METRICS_PROVIDER: prometheus

  test:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      postgres:
        image: timescale/timescaledb-ha:pg18.4-ts2.29.2
        env:
          POSTGRES_DB: incidentpilot
          POSTGRES_USER: ip
          POSTGRES_PASSWORD: ip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ip -d incidentpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
        working-directory: bot

      # INV-01 first and on its own. It is the invariant everything downstream
      # depends on and the only one that cannot be added later without a
      # rewrite, so it fails the build loudly rather than inside a summary line.
      - name: INV-01 - domain purity
        run: uv run pytest tests/unit/test_domain_purity.py -q
        working-directory: bot

      # INV-02, also on its own, and for the same reason. B-01 -- fetching the
      # Slack thread at resolve time -- is the defect the whole architecture is
      # shaped around, and its failure mode is silent: no 429, no exception,
      # just a transcript that is quietly shorter than it should be. Needs no
      # database, so it runs before the slower jobs.
      - name: INV-02 - conversations.history is never called on the hot path
        run: uv run pytest tests/integration/test_no_history_calls.py -q
        working-directory: bot

      - name: Unit tests
        run: uv run pytest tests/unit -q --cov=incidentpilot --cov-report=term-missing
        working-directory: bot

      # Applied here as well as by tests/integration/conftest.py, and that is
      # deliberate belt-and-braces. Until the conftest existed, the schema was a
      # side effect of one test module running first; this step is what makes
      # the dependency visible in the workflow instead of implied by
      # alphabetical collection order.
      - name: Apply migrations from empty
        run: uv run alembic upgrade head
        working-directory: bot
        env:
          IP_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot

      # Actions service containers publish on the standard ports, while the
      # local compose defaults are remapped to avoid collisions with sibling
      # projects -- so CI states both URLs explicitly rather than inheriting a
      # default that is right in only one of the two places.
      - name: Integration tests (real Postgres + Valkey)
        run: uv run pytest tests/integration -q -m integration
        working-directory: bot
        env:
          IP_TEST_VALKEY_URL: redis://localhost:6379/15
          IP_TEST_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot
          IP_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot

      # G4 as a job step rather than only as a make target, because a gate that
      # only runs when someone remembers to run it is not a gate. The script
      # asserts the skip count too: pytest exits 0 when every test skips, and a
      # database that failed to come up looks exactly like that.
      - name: G4 - 200 messages, 200 rows, zero history calls
        run: bash scripts/gate_g4.sh
        env:
          IP_TEST_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot
          IP_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot

      # G5's assertion is about what the channel was TOLD, not only about who
      # was paged: a fallback that resolves someone and looks identical to a
      # healthy page is the silent failure the gate exists to catch.
      - name: G5 - the on-call ladder, announced at every rung
        run: bash scripts/gate_g5.sh
        env:
          IP_TEST_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot
          IP_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot

      # The flagship. Both halves: a blocked provider still posts a document,
      # and a working one posts nothing that is not cited. G6 also re-runs the
      # INV-07 grep, because a gate that depends on another job having run is
      # not a gate.
      - name: G6 - impact computed first, and the grounded PIR
        run: bash scripts/gate_g6.sh
        env:
          IP_TEST_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot
          IP_DATABASE_URL: postgresql+psycopg://ip:ip@localhost:5432/incidentpilot

  # B-11, discharged. Rev 1 shipped an eval job gated on
  # `github.event.head_commit.modified` -- only populated on push, absent on
  # pull requests, and a list, so `contains()` tested exact element equality and
  # was false essentially always. That job never executed once, which is worse
  # than having no gate: everyone believed there was one.
  #
  # This is the fix, and the fix is only real if it goes red. G7's acceptance
  # criterion is a screenshot of exactly that: edit one word of
  # pir_v2_1_0.md, open a PR, and this job fails on `prompt_drift` with the
  # sticky comment naming the prompt.
  eval-gate:
    needs: [changes, test]
    if: needs.changes.outputs.prompts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
        working-directory: bot

      # No services block, and that is the point rather than an omission. The
      # replay runs entirely in memory against fake adapters, so it needs no
      # Postgres, no Valkey, no credentials and no network -- INV-10 is
      # asserted by a socket guard inside the run, and `network calls 0` is a
      # row in the report below.
      - name: Replay the corpus and gate on it
        run: uv run python -m eval.run --corpus eval/corpus --gate --report ../eval-report.md
        working-directory: bot

      # Uploaded even when the gate failed: the report IS the failure message,
      # and a reviewer who has to reproduce the run locally to find out which
      # metric moved will stop reading the gate.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md

      - name: Post the metric table on the PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: eval-report.md

  # Config lives outside bot/, so it gets its own trigger. INV-11 is a property
  # of a YAML file, and a comment in a YAML file survives exactly until someone
  # reorganizes the routing tree.
  config-invariants:
    needs: changes
    if: needs.changes.outputs.config == 'true' || needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
        working-directory: bot

      - name: INV-11 - the down-alert must not route through us
        run: uv run pytest tests/unit/test_alertmanager_config.py -q
        working-directory: bot

      # W7-21. The burn-rate rules are the alerting half of docs/SLO.md, and a
      # rule file with a typo in a PromQL expression loads silently and never
      # fires -- the same shape of failure as the eval job that never ran.
      # promtool parses every expression, so a broken rule is a build failure.
      - name: Prometheus rules are valid
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus/rules:/rules:ro"             --entrypoint promtool prom/prometheus:v3.14.0             check rules /rules/incidentpilot-slo.yml

      - name: Alertmanager config is valid
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.34.0 \
            check-config /cfg/alertmanager.yml

      # The pattern is anchored at a YAML key position on purpose. Unanchored,
      # `image:.*:latest` matches this very line in this very file -- the check
      # failed on its own source and reported a floating tag that does not
      # exist. A guard that flags itself teaches people to ignore it.
      - name: No floating image tags
        run: |
          if grep -rn --include="*.yml" --include="*.yaml"                -E "^[[:space:]]*image:[[:space:]]*[^[:space:]]+:latest" . ; then
            echo "::error::floating 'latest' tag - pin the version"
            exit 1
          fi
          echo "no floating tags"

      # ADR 0002. Every pin in the plan was verified individually and the
      # combination was not: timescale/timescaledb-ha:pg18.6-ts2.29.2 does not
      # exist, because the HA image lags the PostgreSQL patch stream. Nothing in
      # the suite caught it -- unit tests use fakes and integration tests skip
      # when the database is unreachable, which is exactly what a failed pull
      # looks like. It would have surfaced on someone else's first clone.
      - name: Every referenced image actually exists
        run: docker compose pull --quiet
        env:
          SLACK_SIGNING_SECRET: ci-placeholder

  # The dashboard's own gate. `next build` runs tsc and ESLint, so a type error
  # fails the build rather than shipping -- which is the point of setting
  # `typescript.ignoreBuildErrors: false` rather than leaving the default.
  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life in April 2026. Shipping an end-of-life
          # runtime in a project about operational rigour is the first thing a
          # reviewer checks.
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # `npm ci`, never `npm install`: the lockfile is the contract, and a CI
      # run that resolves fresh versions is a CI run testing something the
      # developer never had (B-14).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:no-any
      - run: npm run lint
      - run: npm run build

  docker:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the bot image
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          target: runtime
          push: false
          load: true
          tags: incidentpilot-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id incidentpilot-bot:ci -u)
          [ "$uid" = "10001" ] || { echo "::error::container runs as uid $uid, expected 10001"; exit 1; }
          echo "runs as uid 10001"

  # Rev 1 used gitleaks-action@v2 on a default (depth-1) checkout. Two problems,
  # and only the second one ever turned the build red:
  #
  #   1. On a push the action scans `<before>^..<after>` -- a DIFF, not the
  #      repository. Seven weeks of green meant "these commits leaked nothing",
  #      never "this repository contains no secret". The first commit was never
  #      scanned by CI at all. Same shape as B-11 above: a gate you believe
  #      covers one thing while it covers another.
  #   2. `<before>^` does not exist in a depth-1 clone, so git errored, gitleaks
  #      logged `scanned ~0 bytes` -- and the action exited 1 anyway. The run
  #      that finally went red is the run that scanned nothing.
  #
  # So: fetch the whole history and drive the pinned binary over every commit.
  # A secret is a secret whether or not this particular push happened to touch
  # it.
  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # History, not the working tree. Every byte in the checkout arrived as an
      # added line in some patch, so the history scan is a superset of a tree
      # scan -- and `gitleaks dir` additionally walks .venv/ and .next/, which
      # is 178 MB of third-party code and build output that says nothing about
      # this repository. Exemptions live in .gitleaksignore as commit-scoped
      # fingerprints, so no path is ever blanket-silenced.
      - name: Secrets anywhere in history
        run: gitleaks git . --redact --verbose --exit-code 1

      # Pinned, because `@master` is a moving dependency that can turn a green
      # build red without a commit in this repository.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
