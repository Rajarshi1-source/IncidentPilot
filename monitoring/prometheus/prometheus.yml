global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    environment: local

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The bot monitors itself. Dashboard B in the README is built entirely from
  # this job, and "the incident tool has its own SLO dashboard" is the line that
  # lands with SRE interviewers.
  - job_name: incidentpilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
